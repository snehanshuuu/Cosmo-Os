<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cyber Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1713" />
      <stop offset="100%" stop-color="#050B08" />
    </radialGradient>
  </defs>

  <!-- Dark Translucent Circular Background -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#7CFF00" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00E5FF" stroke-width="0.8" stroke-dasharray="3,2" stroke-opacity="0.5" />

  <!-- Cyber Cat Emblem Group -->
  <g filter="url(#glow)">
    <!-- Ears -->
    <polygon points="22,38 32,16 42,32" fill="rgba(124,255,0,0.15)" stroke="#7CFF00" stroke-width="2" stroke-linejoin="round" />
    <polygon points="78,38 68,16 58,32" fill="rgba(124,255,0,0.15)" stroke="#7CFF00" stroke-width="2" stroke-linejoin="round" />
    <polygon points="26,34 32,20 38,30" fill="rgba(0,229,255,0.3)" stroke="#00E5FF" stroke-width="1" />
    <polygon points="74,34 68,20 62,30" fill="rgba(0,229,255,0.3)" stroke="#00E5FF" stroke-width="1" />

    <!-- Head Outline / Jaw -->
    <polygon points="22,38 50,78 78,38" fill="none" stroke="#7CFF00" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Cyber Eye Visors with Glowing Reticles -->
    <polygon points="28,42 42,42 38,50 32,50" fill="#00E5FF" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1" />
    <polygon points="72,42 58,42 62,50 68,50" fill="#00E5FF" fill-opacity="0.8" stroke="#00E5FF" stroke-width="1" />
    
    <circle cx="35" cy="46" r="1.5" fill="#7CFF00" />
    <circle cx="65" cy="46" r="1.5" fill="#7CFF00" />

    <!-- Nose / Mouth Core -->
    <polygon points="50,56 46,60 54,60" fill="#7CFF00" />
    <path d="M46,63 Q50,67 54,63" fill="none" stroke="#7CFF00" stroke-width="1.5" stroke-linecap="round" />

    <!-- Circuit Whiskers -->
    <path d="M14,46 L26,48 M10,54 L24,52" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="14" cy="46" r="1" fill="#00E5FF" />
    <circle cx="10" cy="54" r="1" fill="#00E5FF" />

    <path d="M86,46 L74,48 M90,54 L76,52" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="86" cy="46" r="1" fill="#00E5FF" />
    <circle cx="90" cy="54" r="1" fill="#00E5FF" />

    <!-- Forehead Tech Node -->
    <circle cx="50" cy="34" r="2.5" fill="#7CFF00" />
    <line x1="50" y1="26" x2="50" y2="31.5" stroke="#7CFF00" stroke-width="1.5" />
  </g>
</svg>
