<svg viewBox="0 0 100 100" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crisp Sci-Fi Emissive Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dark Metallic Radial Background Gradient -->
    <radialGradient id="dark-metallic-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1215" />
      <stop offset="100%" stop-color="#05080a" />
    </radialGradient>
  </defs>

  <!-- Dark Metallic Circular Backdrop -->
  <circle cx="50" cy="50" r="46" fill="url(#dark-metallic-bg)" />

  <!-- Outer Ring with Glowing Neon Green Border -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#7CFF00" stroke-width="2" filter="url(#neon-glow)" />

  <!-- Inner Dashed Cyan Accent Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 2.5" stroke-opacity="0.85" />

  <!-- Symmetrical Geometric Cyber-Cat Face Emblem -->
  <g filter="url(#neon-glow)">
    <!-- Circuit Board Trace Accents in Subdued Green/Cyan -->
    <path d="M 22 28 L 14 28 M 78 28 L 86 28 M 50 8 L 50 14" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round" />
    <circle cx="14" cy="28" r="1.2" fill="#00E5FF" fill-opacity="0.7" />
    <circle cx="86" cy="28" r="1.2" fill="#00E5FF" fill-opacity="0.7" />

    <!-- Two Sharp Neon-Outlined Triangular Ears with Cyan Inner Glow -->
    <polygon points="18,36 30,12 40,32" fill="rgba(0, 229, 255, 0.25)" stroke="#7CFF00" stroke-width="2" stroke-linejoin="round" />
    <polygon points="82,36 70,12 60,32" fill="rgba(0, 229, 255, 0.25)" stroke="#7CFF00" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Inner Ear Accent Lines -->
    <polygon points="24,32 30,18 36,30" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linejoin="round" />
    <polygon points="76,32 70,18 64,30" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-linejoin="round" />

    <!-- Inverted Neon Green Main Face Contour Triangle -->
    <polygon points="20,38 50,82 80,38" fill="rgba(11, 18, 21, 0.9)" stroke="#7CFF00" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Sleek Cyan Geometric Eyes -->
    <polygon points="26,44 42,44 36,52 30,52" fill="#00E5FF" stroke="#00E5FF" stroke-width="0.8" />
    <polygon points="74,44 58,44 64,52 70,52" fill="#00E5FF" stroke="#00E5FF" stroke-width="0.8" />

    <!-- Glowing Eye Reticle Pupils -->
    <circle cx="34" cy="48" r="1.5" fill="#7CFF00" />
    <circle cx="66" cy="48" r="1.5" fill="#7CFF00" />

    <!-- Nose Node & Mouth Lines -->
    <polygon points="50,58 45,63 55,63" fill="#7CFF00" />
    <path d="M 44,67 Q 50,72 56,67" fill="none" stroke="#7CFF00" stroke-width="1.8" stroke-linecap="round" />

    <!-- Sleek Geometric Whiskers -->
    <path d="M 10,48 L 22,50 M 8,56 L 20,54" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 90,48 L 78,50 M 92,56 L 80,54" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" />

    <!-- Forehead Cyber Crystal Node -->
    <polygon points="50,24 54,30 50,36 46,30" fill="#7CFF00" stroke="#00E5FF" stroke-width="0.8" />
  </g>
</svg>
